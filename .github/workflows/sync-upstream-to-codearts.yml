name: sync-upstream-to-codearts

# 作用: 把官方 ClawManager 的 main 同步到本 fork(upstream-mirror) 并推送到华为云 CodeArts main。
#       custom 分支只在 CodeArts, 本流程不涉及。
#
# 触发方式:
#   1) schedule    每 ~15 分钟轮询官方是否有新 commit (近实时; GitHub 无法给非本人仓库配 webhook)
#   2) repository_dispatch(upstream-updated)  外部监听器可即时触发, 见文末 curl 示例
#   3) workflow_dispatch  手动
#
# 认证方式: CodeArts 推送用 SSH 私钥 (secret: CODEARTS_SSH_KEY)。
#   需在本 fork(ibmfashion/nmw) Settings -> Secrets -> Actions 配置:
#     CODEARTS_SSH_KEY  = SSH 私钥全文(含 BEGIN/END 行), 对应公钥已加到 CodeArts 个人设置->SSH密钥
#   fork 侧的 upstream-mirror 分支推送用内置 GITHUB_TOKEN, 无需额外配置。

on:
  schedule:
    - cron: '3,18,33,48 * * * *'   # 约每 15 分钟, 避开整点
  repository_dispatch:
    types: [upstream-updated]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-mirror
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/Yuan-lab-LLM/ClawManager.git
  # CodeArts SSH 地址 (注意是冒号分隔, 不是斜杠; 仓库名务必与实际一致: nmw 还是 nmw666)
  CODEARTS_SSH_URL: git@codehub.devcloud.cn-east-3.huaweicloud.com:14dbed93e27c4091967633086e9c75f0/nmw.git
  CODEARTS_SSH_HOST: codehub.devcloud.cn-east-3.huaweicloud.com
  UPSTREAM_BRANCH: main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Configure git
        run: |
          git config --global user.name  "mirror-bot"
          git config --global user.email "mirror-bot@users.noreply.github.com"

      - name: Detect upstream change
        id: detect
        run: |
          git init work && cd work
          git remote add upstream "${UPSTREAM_URL}"
          git fetch --tags upstream "${UPSTREAM_BRANCH}"
          NEW="$(git rev-parse upstream/${UPSTREAM_BRANCH})"
          FORK="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          OLD="$(git ls-remote "$FORK" refs/heads/upstream-mirror | awk '{print $1}')"
          echo "官方 main = ${NEW:0:12} ; 上次已镜像 = ${OLD:0:12}"
          if [ "$NEW" = "$OLD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "无新 commit, 跳过。"
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo "sha=$NEW"       >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH for CodeArts
        if: steps.detect.outputs.changed == 'true'
        run: |
          test -n "${{ secrets.CODEARTS_SSH_KEY }}" || { echo "❌ secret CODEARTS_SSH_KEY 未配置/为空"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.CODEARTS_SSH_KEY }}" > ~/.ssh/codearts_key
          chmod 600 ~/.ssh/codearts_key
          # 抓取 CodeArts host key, 失败也无妨(下一步 GIT_SSH_COMMAND 用 accept-new 兜底)
          ssh-keyscan -H "${CODEARTS_SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Push official main to Huawei CodeArts (SSH)
        if: steps.detect.outputs.changed == 'true'
        working-directory: work
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/codearts_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
        run: |
          git push --force --tags "${CODEARTS_SSH_URL}" \
            "upstream/${UPSTREAM_BRANCH}:refs/heads/main"
          echo "✅ 已把官方 ${{ steps.detect.outputs.sha }} 推送到 CodeArts main"

      - name: Advance fork mirror marker (upstream-mirror)
        # 放在 CodeArts 推送成功之后: 这个分支是"已同步"标记, 只有 CodeArts 真拿到代码才前进,
        # 否则下次 detect 仍判定 changed=true 会自动重试, 不会出现"标记超前但 CodeArts 没同步"的死锁。
        if: steps.detect.outputs.changed == 'true'
        working-directory: work
        run: |
          # 只推分支内容, 不推 tags: 仅用于变化检测比对 SHA; 且默认 GITHUB_TOKEN 无 workflows 权限,
          # 推带 .github/workflows 改动的 tag 会被拒(官方版本 tag 已在上一步推到 CodeArts)。
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            "upstream/${UPSTREAM_BRANCH}:refs/heads/upstream-mirror"

      - name: Summary
        if: steps.detect.outputs.changed == 'true'
        run: echo "同步完成。CodeArts 会触发验证构建; ECS 端执行 ops/huawei/01-sync-upstream.sh 合并进 custom。"

# ── 外部即时触发示例(可选) ──────────────────────────────────────────────
# 任意能访问 GitHub API 的监听器(如自建脚本轮询官方 releases.atom/commits.atom,
# 或 IFTTT/Zapier)发现官方更新后, POST 下面接口即可秒级触发本流程:
#
#   curl -X POST \
#     -H "Authorization: Bearer <你的PAT, 需 repo 权限>" \
#     -H "Accept: application/vnd.github+json" \
#     https://api.github.com/repos/ibmfashion/nmw/dispatches \
#     -d '{"event_type":"upstream-updated"}'
